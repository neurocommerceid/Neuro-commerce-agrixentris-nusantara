name: Deploy AgriXentris Nusantara to Vercel (Neuro Commerce)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run Unit Tests
        run: npx --yes tsx --test src/utils/catalogLogic.test.ts

      - name: Typecheck & Lint
        run: npm run lint

      - name: Build Production Bundle
        run: npm run build
